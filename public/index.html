<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Healthcare Information Exchange</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4">Centralized Health Information Exchange</h1>
    
    <!-- Notification Area -->
    <div id="notification-area"></div>
    
    <div class="row">
      <div class="col-md-4">
        <div class="card">
          <div class="card-header">
            Add New Patient
          </div>
          <div class="card-body">
            <form id="addPatientForm">
              <div class="mb-3">
                <label for="patientName" class="form-label">Name</label>
                <input type="text" class="form-control" id="patientName" required>
              </div>
              <div class="mb-3">
                <label for="patientAge" class="form-label">Age</label>
                <input type="number" class="form-control" id="patientAge" required>
              </div>
              <div class="mb-3">
                <label for="patientGender" class="form-label">Gender</label>
                <select class="form-select" id="patientGender" required>
                  <option value="">Select</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="patientContact" class="form-label">Contact Information</label>
                <input type="text" class="form-control" id="patientContact">
              </div>
              <div class="mb-3">
                <label for="patientHistory" class="form-label">Medical History</label>
                <textarea class="form-control" id="patientHistory" rows="3"></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Add Patient</button>
            </form>
          </div>
        </div>
      </div>
      
      <div class="col-md-8">
        <h3>Patient Records</h3>
        <div class="row" id="patientList">
          <!-- Patient cards will be added here dynamically -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/scripts.js"></script>
</body>
</html>
