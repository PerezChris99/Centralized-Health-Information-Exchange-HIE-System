<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Login - Health Information Exchange System">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    
    <title>Login - Health Information Exchange</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
    
    <!-- External CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous">
    
    <!-- App CSS -->
    <link rel="stylesheet" href="css/main.css?v=2">
    <link rel="stylesheet" href="css/auth.css?v=2">
</head>
<body class="bg-primary-light">
    <!-- Navigation -->
    <nav class="navbar auth-navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/index.html">
                <i class="fas fa-heartbeat me-2"></i>HIE Uganda
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#authNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="authNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/index.html"><i class="fas fa-home me-1"></i>Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/index.html#features">Features</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/faq.html"><i class="fas fa-question-circle me-1"></i>FAQ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/contact.html"><i class="fas fa-envelope me-1"></i>Contact</a>
                    </li>
                </ul>
                <a href="/register.html" class="btn btn-signup">Sign Up</a>
            </div>
        </div>
    </nav>

    <div class="container-centered">
        <div class="auth-card fade-in">
            <!-- Logo & Header -->
            <div class="text-center mb-4">
                <div class="medical-icon">
                    <i class="fas fa-hospital-user"></i>
                </div>
                <h2 class="text-primary-color mb-2">Welcome Back</h2>
                <p class="text-muted">Sign in to access the Health Information Exchange System</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope text-muted me-2"></i>Email Address
                    </label>
                    <input 
                        type="email" 
                        class="form-control" 
                        id="email" 
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock text-muted me-2"></i>Password
                    </label>
                    <div class="input-group">
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label text-muted small" for="rememberMe">
                            Remember me
                        </label>
                    </div>
                    <a href="#" class="small text-primary-color" id="forgotPasswordLink">
                        Forgot password?
                    </a>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-medical">
                        <i class="fas fa-sign-in-alt me-2"></i>Sign In
                    </button>
                </div>

                <div class="text-center">
                    <span class="text-muted small">Don't have an account? </span>
                    <a href="register.html" class="text-primary-color small">Register here</a>
                </div>
            </form>
        </div>

        <!-- Footer -->
        <div class="text-center mt-4">
            <small class="text-muted">
                &copy; 2026 Health Information Exchange System - Uganda. All rights reserved.
            </small>
            <div class="mt-2">
                <a href="/index.html" class="text-muted small me-3">Home</a>
                <a href="/faq.html" class="text-muted small me-3">FAQ</a>
                <a href="/contact.html" class="text-muted small">Contact Us</a>
            </div>
        </div>
    </div>

    <!-- External JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    
    <!-- App JS -->
    <script src="js/app.js?v=4"></script>
    <script src="js/auth.js"></script>
    
    <!-- Page-specific JS -->
    <script>
        // Initialize login page
        AuthModule.initLoginPage();
    </script>
</body>
</html>
