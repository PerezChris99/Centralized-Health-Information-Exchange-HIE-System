<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Healthcare Information Exchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5 col-xl-4 col-sm-10">
                <div class="auth-card fade-in">
                    <div class="text-center">
                        <div class="medical-icon">
                            <i class="fas fa-hospital-user"></i>
                        </div>
                        <h2 class="mb-4" style="color: var(--primary-color)">Welcome Back</h2>
                        <p class="text-muted mb-4">Sign in to access the health information exchange system</p>
                    </div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">
                                <i class="fas fa-user text-muted me-2"></i>Username
                            </label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">
                                <i class="fas fa-lock text-muted me-2"></i>Password
                            </label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-medical mb-3">
                                Sign In
                            </button>
                        </div>
                        <div class="text-center text-muted">
                            <small>Don't have an account? <a href="/register.html" style="color: var(--primary-color)">Register here</a></small>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
