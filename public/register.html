<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Health Information Exchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="text-center mb-4">Registration Form</h1>
                        <div class="progress-bar d-flex justify-content-between mb-4 mx-auto" style="max-width: 300px;">
                            <div class="step active">Step 1</div>
                            <div class="step">Step 2</div>
                        </div>
                        <form id="registrationForm" class="registration-form">
                            <!-- Step 1 -->
                            <div class="form-step" id="step1">
                                <div class="mb-3">
                                    <label for="userType" class="form-label">Register as:</label>
                                    <select id="userType" class="form-select" required>
                                        <option value="">Select user type</option>
                                        <option value="patient">Patient</option>
                                        <option value="healthcare-provider">Healthcare Provider</option>
                                        <option value="admin">Administrator</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="fullName" class="form-label">Full Name:</label>
                                    <input type="text" class="form-control" id="fullName" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email:</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password:</label>
                                    <input type="password" class="form-control" id="password" required>
                                </div>
                                <div class="d-grid">
                                    <button type="button" class="btn btn-medical" onclick="nextStep()">Next</button>
                                </div>
                            </div>
                            
                            <!-- Step 2 -->
                            <div class="form-step" id="step2" style="display: none;">
                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">Confirm Password:</label>
                                    <input type="password" class="form-control" id="confirmPassword" required>
                                </div>
                                <div class="mb-3">
                                    <label for="phone" class="form-label">Phone Number:</label>
                                    <input type="tel" class="form-control" id="phone" required>
                                </div>
                                <div class="mb-3">
                                    <label for="address" class="form-label">Address:</label>
                                    <input type="text" class="form-control" id="address" required>
                                </div>
                                <div class="d-flex gap-2">
                                    <button type="button" class="btn btn-outline-secondary flex-grow-1" onclick="previousStep()">Previous</button>
                                    <button type="submit" class="btn btn-medical flex-grow-1">Register</button>
                                </div>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <a href="login.html">Already have an account? Login here</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function nextStep() {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            document.querySelectorAll('.step')[1].classList.add('active');
        }

        function previousStep() {
            document.getElementById('step1').style.display = 'block';
            document.getElementById('step2').style.display = 'none';
            document.querySelectorAll('.step')[1].classList.remove('active');
        }

        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Add your registration logic here
            console.log('Form submitted');
        });
    </script>
</body>
</html>
