<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Healthcare Information Exchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="navbar navbar-medical navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-hospital me-2"></i>
                Health Information Exchange
            </a>
            <div class="d-flex align-items-center">
                <span class="me-3 text-muted">
                    <i class="fas fa-user-md me-1"></i>
                    Dr. John Doe
                </span>
                <button id="logoutBtn" class="btn btn-outline-danger">
                    <i class="fas fa-sign-out-alt me-1"></i>
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="medical-container">
                    <h4 class="mb-4">
                        <i class="fas fa-user-plus text-primary me-2"></i>
                        Add New Patient
                    </h4>
                    <form id="addPatientForm">
                        <div class="mb-3">
                            <label for="patientName" class="form-label">Name</label>
                            <input type="text" class="form-control" id="patientName" required>
                        </div>
                        <div class="mb-3">
                            <label for="patientAge" class="form-label">Age</label>
                            <input type="number" class="form-control" id="patientAge" required>
                        </div>
                        <div class="mb-3">
                            <label for="patientGender" class="form-label">Gender</label>
                            <select class="form-control" id="patientGender" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="patientContact" class="form-label">Contact Info</label>
                            <input type="text" class="form-control" id="patientContact" required>
                        </div>
                        <div class="mb-3">
                            <label for="patientHistory" class="form-label">Medical History</label>
                            <textarea class="form-control" id="patientHistory" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-medical w-100">
                            <i class="fas fa-plus-circle me-2"></i>
                            Add Patient
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="col-md-8">
                <div class="medical-container">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4>
                            <i class="fas fa-users text-primary me-2"></i>
                            Patient Records
                        </h4>
                        <div class="input-group" style="width: 300px;">
                            <span class="input-group-text">
                                <i class="fas fa-search"></i>
                            </span>
                            <input type="text" class="form-control" placeholder="Search patients...">
                        </div>
                    </div>
                    <div class="row" id="patientList">
                        <!-- Patient cards will be added here dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/scripts.js"></script>
</body>
</html>
